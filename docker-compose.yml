version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: retainiq_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: retainiq
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: retainiq_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: retainiq
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retainiq_api
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      # Connect using the internal docker network (mysql:3306)
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/retainiq
    volumes:
      # Mount local backend dir for hot reloading during development
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
